<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>專案計劃書排版工具 - 符合大專生計畫規格與評審視角檢驗</title>

  <!-- Bootstrap 5.3.3 CSS (CDN 固定版本) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons 1.11.3 (CDN 固定版本) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- Custom App & Document Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Top Navigation Bar (Section 4.1) -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom px-3 py-2 no-print">
    <div class="container-fluid p-0">
      <a class="navbar-brand d-flex align-items-center text-primary" href="#">
        <i class="bi bi-journal-text fs-4 me-2"></i>
        <span>專案計劃書排版工具</span>
      </a>

      <div class="d-flex align-items-center me-auto ms-3 d-none d-lg-flex">
        <span class="badge bg-secondary-subtle text-secondary-emphasis me-2" id="nav-project-title">載入中...</span>
        <span class="badge bg-success" id="nav-quality-badge"><i class="bi bi-shield-check me-1"></i>品質檢測中</span>
      </div>

      <!-- Center Autosave Status -->
      <div id="save-status" class="small mx-2 d-none d-md-block">
        <span class="text-muted"><i class="bi bi-clock me-1"></i>準備中</span>
      </div>

      <!-- Action Buttons -->
      <div class="d-flex align-items-center gap-2">
        <!-- Load Sample -->
        <button id="btn-load-sample" class="btn btn-outline-secondary btn-sm" title="載入「智慧農業精準灌溉系統」預設範例">
          <i class="bi bi-journal-bookmark me-1"></i>範例
        </button>

        <!-- Version History -->
        <button id="btn-snapshots" class="btn btn-outline-secondary btn-sm" title="檢視最近 20 個歷史版本快照">
          <i class="bi bi-clock-history me-1"></i>版本
        </button>

        <!-- Import / Export JSON -->
        <label class="btn btn-outline-secondary btn-sm mb-0" title="匯入 .json 計畫書專案檔">
          <i class="bi bi-upload me-1"></i>匯入
          <input type="file" id="file-import-json" class="d-none" accept=".json,application/json" />
        </label>
        <button id="btn-export-json" class="btn btn-outline-secondary btn-sm" title="下載專案備份檔 (.json)">
          <i class="bi bi-download me-1"></i>備份
        </button>

        <div class="vr d-none d-sm-block"></div>

        <!-- Export DOCX & PDF -->
        <button id="btn-export-docx" class="btn btn-primary btn-sm fw-bold" title="匯出標準大專生計畫書 Word (.docx) 檔">
          <i class="bi bi-file-earmark-word me-1"></i>匯出 Word
        </button>
        <button id="btn-export-pdf" class="btn btn-danger btn-sm fw-bold" title="以瀏覽器直接列印或另存為 A4 PDF">
          <i class="bi bi-file-earmark-pdf me-1"></i>列印 / PDF
        </button>

        <!-- Theme Toggle -->
        <button id="btn-toggle-theme" class="btn btn-light btn-sm border" title="切換編輯區淺色/深色主題">
          <i class="bi bi-moon-stars"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main 3-Column Container (Section 4.1 Grid: col-lg-2 / col-lg-5 / col-lg-5) -->
  <div class="container-fluid p-0 main-container">
    <div class="row g-0 h-100">

      <!-- COLUMN 1: LEFT NAVIGATION & CHAPTER COMPLETION (col-lg-2) -->
      <div class="col-12 col-md-3 col-lg-2 column-panel d-flex flex-column justify-content-between no-print">
        <div class="p-2 border-bottom bg-light">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="small fw-bold text-muted"><i class="bi bi-list-check me-1"></i>章節導覽與進度</span>
            <span class="badge bg-primary-subtle text-primary">大專生規格</span>
          </div>
        </div>

        <div id="nav-chapter-list" class="flex-grow-1 overflow-y-auto">
          <!-- Dynamic chapter list will be rendered here -->
        </div>

        <div class="p-2 border-top bg-light text-center">
          <button id="btn-new-project" class="btn btn-outline-danger btn-sm w-100">
            <i class="bi bi-trash3 me-1"></i>開新專案 / 清空
          </button>
        </div>
      </div>

      <!-- COLUMN 2: CENTER EDITOR & FORM AREA (col-lg-5) -->
      <div id="editor-column" class="col-12 col-md-4 col-lg-5 column-panel no-print">
        <!-- Dynamic editor content (Cover or Chapter Markdown) will be rendered here -->
      </div>

      <!-- COLUMN 3: RIGHT PANEL (PREVIEW / JUDGE REVIEW / MCP GUIDE) (col-lg-5) -->
      <div id="preview-column" class="col-12 col-md-5 col-lg-5 column-panel d-flex flex-column">

        <!-- Top Tabs Switcher -->
        <div class="border-bottom bg-body px-3 pt-2 no-print">
          <ul class="nav nav-tabs card-header-tabs" id="rightTabs" role="tablist">
            <li class="nav-item">
              <button class="nav-link active fw-bold" id="tab-preview-btn" data-bs-toggle="tab" data-bs-target="#tab-preview" type="button" role="tab">
                <i class="bi bi-file-earmark-richtext me-1"></i>A4 即時預覽
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link fw-bold" id="tab-judge-btn" data-bs-toggle="tab" data-bs-target="#tab-judge" type="button" role="tab">
                <i class="bi bi-clipboard2-check me-1"></i>評審視角檢閱
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link fw-bold text-primary" id="tab-mcp-btn" data-bs-toggle="tab" data-bs-target="#tab-mcp" type="button" role="tab">
                <i class="bi bi-robot me-1"></i>本地 MCP 教學
              </button>
            </li>
          </ul>
        </div>

        <!-- Tab Content Areas -->
        <div class="tab-content flex-grow-1 overflow-y-auto" id="rightTabsContent">

          <!-- TAB 1: A4 LIVE PREVIEW -->
          <div class="tab-pane fade show active h-100" id="tab-preview" role="tabpanel">
            <div class="preview-container">
              <!-- Sticky Preview Zoom Toolbar -->
              <div class="preview-toolbar no-print">
                <span class="text-white small fw-bold"><i class="bi bi-file-earmark-pdf me-1"></i>A4 模擬排版</span>
                <div class="btn-group btn-group-sm">
                  <button id="btn-zoom-out" class="btn btn-dark btn-sm" title="縮小"><i class="bi bi-dash"></i></button>
                  <button id="btn-zoom-reset" class="btn btn-dark btn-sm" title="重設縮放">90%</button>
                  <button id="btn-zoom-in" class="btn btn-dark btn-sm" title="放大"><i class="bi bi-plus"></i></button>
                </div>
                <span class="badge bg-secondary">標楷體 / Times New Roman</span>
              </div>

              <!-- A4 Simulated Pages Container -->
              <div id="preview-sheet-container" class="w-100 d-flex flex-column align-items-center gap-4">
                <!-- A4 Pages generated dynamically here -->
              </div>
            </div>
          </div>

          <!-- TAB 2: REVIEW AS JUDGE & VALIDATOR -->
          <div class="tab-pane fade" id="tab-judge" role="tabpanel">
            <div id="judge-panel-container">
              <!-- Judge Review rendered dynamically here -->
            </div>
          </div>

          <!-- TAB 3: MCP LOCAL SERVER GUIDE -->
          <div class="tab-pane fade" id="tab-mcp" role="tabpanel">
            <div id="mcp-panel-container">
              <!-- MCP Guide rendered dynamically here -->
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Load docx UMD Library (Local vendor first, CDN fallback) -->
  <script src="vendor/docx.umd.js"></script>
  <script>
    if (typeof window.docx === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"><\/script>');
    }
  </script>

  <!-- Bootstrap 5.3.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Main Application ES Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
